name: Update Publications

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ORCID works
        env:
          ORCID_ACCESS_TOKEN: ${{ secrets.ORCID_ACCESS_TOKEN }}
        run: |
          if [ -z "$ORCID_ACCESS_TOKEN" ]; then
            echo "Missing ORCID_ACCESS_TOKEN secret."
            exit 1
          fi
          python scripts/orcid_to_bib.py --token "$ORCID_ACCESS_TOKEN"

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.bib
          git commit -m "Update publications"
          git push
